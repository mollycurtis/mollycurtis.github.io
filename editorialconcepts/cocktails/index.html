<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktail Book — Visual Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Barlow:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #080604;
  --leather-dark: #1a0f08;
  --leather-mid: #2c1a0e;
  --leather-light: #3d2514;
  --leather-highlight: #5c3820;
  --leather-sheen: #7a4e2d;
  --gold: #c8a96e;
  --gold-light: #e2c98a;
  --gold-dim: #8a7248;
  --parchment: #eee8d8;
  --parchment-dark: #e0d8c4;
  --text-dark: #1a1510;
  --text-mid: #3a2e20;
  --text-muted: #8a7a62;
  --rule: #a89878;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  background: var(--ink);
  font-family: 'Barlow', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Ambient glow behind book */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 55%, rgba(90,50,20,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 30% 20% at 50% 80%, rgba(200,169,110,0.05) 0%, transparent 60%);
  pointer-events: none;
}

/* Grain overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
  mix-blend-mode: overlay;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 2.5rem;
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  color: rgba(238,232,216,0.5);
  text-decoration: none;
}
.nav-back {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(238,232,216,0.28);
  text-decoration: none;
  transition: color 0.3s;
}
.nav-back:hover { color: rgba(238,232,216,0.6); }

/* ── SCENE ── */
.scene {
  perspective: 2200px;
  perspective-origin: 50% 48%;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── BOOK WRAPPER ── */
.book-wrapper {
  position: relative;
  width: min(880px, 92vw);
  height: min(580px, 88vh);
}

/* ── CLOSED BOOK (cover only) ── */
.book-closed {
  position: absolute;
  inset: 0;
  cursor: pointer;
  transform-style: preserve-3d;
  transform: rotateX(4deg);
  transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.5s;
  animation: floatIn 1.2s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
}

@keyframes floatIn {
  from { opacity: 0; transform: rotateX(4deg) translateY(30px); }
  to   { opacity: 1; transform: rotateX(4deg) translateY(0); }
}

.book-closed:hover { transform: rotateX(6deg) translateY(-4px); }
.book-closed.is-opening { opacity: 0; pointer-events: none; transform: rotateX(4deg) scale(0.96); transition: all 0.55s cubic-bezier(0.25,0.46,0.45,0.94); }

/* Cover surface */
.cover-body {
  width: 100%;
  height: 100%;
  border-radius: 3px 8px 8px 3px;
  position: relative;
  overflow: hidden;
  box-shadow:
    -6px 0 0 #0f0905,
    0 8px 40px rgba(0,0,0,0.85),
    0 2px 8px rgba(0,0,0,0.6),
    inset 0 0 80px rgba(0,0,0,0.3);
  background:
    repeating-linear-gradient(
      92deg,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.04) 3px,
      rgba(0,0,0,0.04) 4px
    ),
    repeating-linear-gradient(
      2deg,
      transparent 0px,
      transparent 8px,
      rgba(255,255,255,0.012) 8px,
      rgba(255,255,255,0.012) 9px
    ),
    linear-gradient(
      162deg,
      #3d2514 0%,
      #2c1a0e 18%,
      #1e1008 38%,
      #2a190c 52%,
      #3a2212 65%,
      #2c1a0e 78%,
      #1a0f08 100%
    );
}

/* Spine */
.cover-spine {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 28px;
  background: linear-gradient(90deg, #0f0905 0%, #1a0f08 30%, #251509 60%, #1a0f08 100%);
  border-right: 1px solid rgba(200,169,110,0.12);
}
.cover-spine::before {
  content: '';
  position: absolute;
  inset: 16px 6px;
  border: 0.5px solid rgba(200,169,110,0.1);
  border-radius: 1px;
}

/* Gold border frame */
.cover-frame {
  position: absolute;
  inset: 18px 18px 18px 36px;
  border: 1px solid rgba(200,169,110,0.35);
  border-radius: 1px;
  pointer-events: none;
}
.cover-frame::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 0.5px solid rgba(200,169,110,0.15);
}

/* Cover content */
.cover-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-left: 28px;
  gap: 1rem;
}

.cover-ornament-top {
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  position: relative;
}
.cover-ornament-top::before {
  content: '✦';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: var(--gold);
  font-size: 8px;
  background: var(--leather-mid);
  padding: 0 6px;
  letter-spacing: 0;
}

.cover-eyebrow {
  font-size: 0.55rem;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--gold-dim);
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
}

.cover-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 300;
  color: var(--gold-light);
  letter-spacing: 0.12em;
  text-align: center;
  line-height: 1.15;
  text-shadow: 0 2px 20px rgba(0,0,0,0.6);
}
.cover-title em {
  font-style: italic;
  font-weight: 300;
  display: block;
  font-size: 0.7em;
  letter-spacing: 0.18em;
  color: var(--gold);
  opacity: 0.75;
  margin-top: 0.15em;
}

.cover-rule {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
}

.cover-year {
  font-size: 0.5rem;
  letter-spacing: 0.5em;
  color: rgba(200,169,110,0.35);
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
}

/* Leather sheen */
.cover-sheen {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 40%, rgba(0,0,0,0.12) 100%);
  pointer-events: none;
}

/* Tap hint */
.tap-hint {
  position: absolute;
  bottom: -2.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.58rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(238,232,216,0.2);
  white-space: nowrap;
  animation: hintPulse 3s ease-in-out infinite 1.5s;
}
@keyframes hintPulse {
  0%,100% { opacity: 0.4; }
  50% { opacity: 0.9; }
}

/* ── OPEN BOOK ── */
.book-open {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transform-style: preserve-3d;
  transform: rotateX(3deg);
  transition: opacity 0.6s 0.3s, transform 0.6s;
}
.book-open.is-visible {
  opacity: 1;
  pointer-events: auto;
}

/* Two-page spread */
.spread {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-radius: 2px 6px 6px 2px;
  overflow: hidden;
  box-shadow:
    0 12px 60px rgba(0,0,0,0.9),
    0 4px 16px rgba(0,0,0,0.6),
    inset 0 0 0 1px rgba(168,152,120,0.12);
  position: relative;
}

/* Center binding shadow */
.spread::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 32px;
  transform: translateX(-50%);
  background: linear-gradient(90deg,
    rgba(0,0,0,0.18) 0%,
    rgba(0,0,0,0.06) 30%,
    rgba(255,255,255,0.015) 50%,
    rgba(0,0,0,0.06) 70%,
    rgba(0,0,0,0.18) 100%);
  pointer-events: none;
  z-index: 10;
}

.page {
  background: var(--parchment);
  padding: 2rem 1.6rem 1.4rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Left page — slight shadow on right edge */
.page--left {
  border-right: 1px solid rgba(168,152,120,0.2);
  box-shadow: inset -8px 0 16px rgba(0,0,0,0.06);
}
/* Right page */
.page--right {
  box-shadow: inset 8px 0 16px rgba(0,0,0,0.04);
}

/* Page header */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 0.9rem;
  margin-bottom: 1.1rem;
  border-bottom: 0.5px solid var(--rule);
  flex-shrink: 0;
}
.page-num {
  font-size: 8px;
  letter-spacing: 0.22em;
  color: var(--text-muted);
}
.page-section {
  font-size: 8px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* Drinks grid — 3 per page */
.drinks-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  flex: 1;
  gap: 0;
  min-height: 0;
}

.drink-col {
  display: flex;
  flex-direction: column;
  padding: 0 0.85rem 0.8rem;
  border-right: 0.5px solid rgba(168,152,120,0.3);
}
.drink-col:last-child { border-right: none; }
.drink-col:first-child { padding-left: 0; }
.drink-col:last-child { padding-right: 0; }

.drink-header {
  padding-top: 0.6rem;
  padding-bottom: 0.65rem;
  border-bottom: 0.5px solid var(--rule);
  margin-bottom: 0.65rem;
  flex-shrink: 0;
}
.drink-name {
  font-family: 'Libre Baskerville', serif;
  font-weight: 700;
  font-size: 13px;
  line-height: 1.2;
  color: var(--text-dark);
  margin-bottom: 3px;
}
.drink-oz {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}
.drink-ingredients {
  font-size: 9.5px;
  font-weight: 300;
  color: var(--text-mid);
  line-height: 1.6;
  margin-bottom: 0.7rem;
  flex-shrink: 0;
}
.sliders {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 0.65rem;
  flex-shrink: 0;
}
.s-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.s-label {
  font-size: 7px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  width: 30px;
  flex-shrink: 0;
}
.track {
  flex: 1;
  height: 1px;
  background: #bfaf98;
  position: relative;
}
.fill {
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  background: #2a201a;
}
.dot {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #2a201a;
  border: 1.5px solid var(--parchment);
  outline: 1px solid #2a201a;
}
.drink-tag {
  font-size: 7.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.8rem;
  flex-shrink: 0;
}
.drink-photo {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}
.drink-photo img {
  width: 90%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
}
.price-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 0.5px solid var(--rule);
  flex-shrink: 0;
}
.price {
  font-family: 'Libre Baskerville', serif;
  font-size: 12px;
  color: var(--text-dark);
}
.serve-note {
  font-size: 7.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ── NAVIGATION ── */
.book-nav {
  position: absolute;
  bottom: -3.2rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 1.5rem;
  opacity: 0;
  transition: opacity 0.5s 0.6s;
}
.book-open.is-visible + .book-nav,
.book-nav.is-visible {
  opacity: 1;
}

.nav-btn {
  width: 36px; height: 36px;
  border: 1px solid rgba(200,169,110,0.25);
  border-radius: 50%;
  background: transparent;
  color: rgba(200,169,110,0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  font-size: 14px;
}
.nav-btn:hover:not(:disabled) {
  border-color: rgba(200,169,110,0.6);
  color: var(--gold-light);
  background: rgba(200,169,110,0.06);
}
.nav-btn:disabled {
  opacity: 0.2;
  cursor: default;
}

.nav-page-info {
  font-size: 0.58rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(238,232,216,0.25);
  min-width: 80px;
  text-align: center;
}

/* Page turn animation */
.spread.turning-next {
  animation: turnNext 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
.spread.turning-prev {
  animation: turnPrev 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes turnNext {
  0%   { opacity:1; transform: rotateY(0deg) translateX(0); }
  50%  { opacity:0; transform: rotateY(-8deg) translateX(-20px); }
  51%  { opacity:0; transform: rotateY(8deg) translateX(20px); }
  100% { opacity:1; transform: rotateY(0deg) translateX(0); }
}
@keyframes turnPrev {
  0%   { opacity:1; transform: rotateY(0deg) translateX(0); }
  50%  { opacity:0; transform: rotateY(8deg) translateX(20px); }
  51%  { opacity:0; transform: rotateY(-8deg) translateX(-20px); }
  100% { opacity:1; transform: rotateY(0deg) translateX(0); }
}

/* Close button */
.close-btn {
  position: fixed;
  top: 1.4rem;
  right: 2.5rem;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(238,232,216,0.25);
  background: none;
  border: none;
  cursor: pointer;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: color 0.3s, opacity 0.4s;
}
.close-btn.is-visible {
  opacity: 1;
  pointer-events: auto;
}
.close-btn:hover { color: rgba(238,232,216,0.6); }
</style>
</head>
<body>

<nav>
  <a href="https://mollycurtis.github.io/visualconcepts/" class="nav-logo">Molly Curtis</a>

</nav>

<div class="scene">

    <div class="book-closed" id="bookClosed" onclick="openBook()">
      <div class="cover-body">
        <div class="cover-spine"></div>

          <span class="cover-eyebrow">Est. 2024</span>
          <h1 class="cover-title">
            Cocktail
            <em>Book</em>
          </h1>
          <div class="cover-rule"></div>
          <span class="cover-year">A · C · B</span>
        </div>
        <div class="cover-sheen"></div>
      </div>
      <p class="tap-hint">Click to open</p>
    </div>

    <!-- OPEN BOOK -->
    <div class="book-open" id="bookOpen">
      <div class="spread" id="spread">
        <!-- Pages populated by JS -->
      </div>
    </div>

    <!-- NAV -->
    <div class="book-nav" id="bookNav">
      <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="nav-page-info" id="pageInfo">Page 1 of 5</span>
      <button class="nav-btn" id="nextBtn" onclick="nextPage()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

  </div>
</div>

      { name: 'Coming Soon', oz: '—', ingredients: 'Wine list coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
      { name: 'Coming Soon', oz: '—', ingredients: 'Wine list coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
      { name: 'Coming Soon', oz: '—', ingredients: 'Wine list coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' }
    ]
  }
];

let currentPage = 0;

function buildDrinkCol(drink) {
  const slidersHTML = drink.sliders.map(s => `
    <div class="s-row">
      <span class="s-label">${s.label}</span>
      <div class="track">
        <div class="fill" style="width:${s.val}%"></div>
        <div class="dot" style="left:${s.val}%"></div>
      </div>
    </div>`).join('');

  const imgHTML = drink.img
    ? `<div class="drink-photo"><img src="${drink.img}" alt="${drink.name}"></div>`
    : `<div class="drink-photo" style="opacity:0.15;align-items:center;justify-content:center;">
        <svg width="40" height="60" viewBox="0 0 40 60" fill="none">
          <ellipse cx="20" cy="52" rx="12" ry="4" fill="#a89878" opacity="0.4"/>
          <path d="M8 52 Q8 20 20 14 Q32 20 32 52" fill="#c8b898" opacity="0.4"/>
        </svg>
       </div>`;

  return `
    <div class="drink-col">
      <div class="drink-header">
        <p class="drink-name">${drink.name}</p>
        <p class="drink-oz">${drink.oz}</p>
      </div>
      <p class="drink-ingredients">${drink.ingredients}</p>
      ${drink.sliders.length ? `<div class="sliders">${slidersHTML}</div>` : ''}
      <p class="drink-tag">${drink.tag}</p>
      ${imgHTML}
      <div class="price-row">
        <span class="serve-note">${drink.serve}</span>
        <span class="price">${drink.price}</span>
      </div>
    </div>`;
}

function buildSpread(pageIndex) {
  const p = pages[pageIndex];
  return `
    <div class="page page--left">
      <div class="page-header">
        <span class="page-num">${p.pageNums[0]}</span>
        <span class="page-section">${p.section}</span>
        <span class="page-num">${p.pageNums[1]}</span>
      </div>
      <div class="drinks-grid">
        ${p.drinks.map(buildDrinkCol).join('')}
      </div>
    </div>
    <div class="page page--right">
      <div class="page-header">
        <span class="page-num">${p.pageNums[0]}</span>
        <span class="page-section">${p.section}</span>
        <span class="page-num">${p.pageNums[1]}</span>
      </div>
      <div class="drinks-grid">
        ${p.drinks.map(buildDrinkCol).join('')}
      </div>
    </div>`;
}

function updateNav() {
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === pages.length - 1;
  document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${pages.length}`;
}

function openBook() {
  document.getElementById('bookClosed').classList.add('is-opening');
  setTimeout(() => {
    document.getElementById('bookClosed').style.display = 'none';
    const bookOpen = document.getElementById('bookOpen');
    const nav = document.getElementById('bookNav');
    bookOpen.innerHTML = `<div class="spread">${buildSpread(0)}</div>`;
    bookOpen.classList.add('is-visible');
    nav.classList.add('is-visible');
    document.getElementById('closeBtn').classList.add('is-visible');
    updateNav();
  }, 500);
}

function closeBook() {
  const bookOpen = document.getElementById('bookOpen');
  const nav = document.getElementById('bookNav');
  bookOpen.classList.remove('is-visible');
  nav.classList.remove('is-visible');
  document.getElementById('closeBtn').classList.remove('is-visible');
  const closed = document.getElementById('bookClosed');
  closed.style.display = '';
  setTimeout(() => closed.classList.remove('is-opening'), 50);
  currentPage = 0;
}

function turnPage(direction) {
  const spread = document.querySelector('.spread');
  const cls = direction === 'next' ? 'turning-next' : 'turning-prev';
  spread.classList.add(cls);
  setTimeout(() => {
    currentPage += direction === 'next' ? 1 : -1;
    document.getElementById('bookOpen').innerHTML = `<div class="spread ${cls}">${buildSpread(currentPage)}</div>`;
    updateNav();
    setTimeout(() => document.querySelector('.spread').classList.remove(cls), 500);
  }, 250);
}

function nextPage() { if (currentPage < pages.length - 1) turnPage('next'); }
function prevPage() { if (currentPage > 0) turnPage('prev'); }

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'Escape') closeBook();
});
</script>
</body>
</html>
