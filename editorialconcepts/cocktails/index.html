<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --parchment: #eee8d8;
  --rule: #a89878;
  --text: #1a1510;
  --text-mid: #3a2e20;
  --text-muted: #8a7a62;
  --card-w: 340px;
  --card-gap: 0px;
}

html, body {
  height: 100%;
  background: #eee8d8;
  font-family: 'Barlow', sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* ── HEADER ── */
.page-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 2.5rem 1.25rem;
  border-bottom: 0.5px solid var(--rule);
  background: var(--parchment);
}
.page-num {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  min-width: 40px;
}
.page-num.right { text-align: right; }
.page-section {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ── SCROLL TRACK ── */
.track-wrap {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  padding-top: 62px; /* header height */
  padding-bottom: 64px; /* dots height */
  overflow: hidden;
}

.track {
  display: flex;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  cursor: grab;
  user-select: none;
}
.track::-webkit-scrollbar { display: none; }
.track.dragging { cursor: grabbing; scroll-behavior: auto; }

/* Left/right padding so first/last card centered-ish */
.track-inner {
  display: flex;
  align-items: stretch;
  padding: 0 calc(50vw - var(--card-w) / 2);
  gap: 0;
}

/* ── COCKTAIL CARD ── */
.card {
  width: var(--card-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 2rem 1.75rem 1.5rem;
  border-right: 0.5px solid var(--rule);
  transition: opacity 0.4s;
}
.card:last-child { border-right: none; }

/* Fade cards that are far from center */
.card.dim { opacity: 0.35; }

.drink-header {
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--rule);
  margin-bottom: 1rem;
}
.drink-name {
  font-family: 'Libre Baskerville', serif;
  font-weight: 700;
  font-size: 21px;
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 6px;
}
.drink-oz {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}
.drink-ingredients {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-mid);
  line-height: 1.65;
  margin-bottom: 1.2rem;
}

.sliders {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 1.2rem;
}
.s-row { display: flex; align-items: center; gap: 10px; }
.s-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  width: 38px;
  flex-shrink: 0;
}
.s-track { flex: 1; height: 1px; background: #bfaf98; position: relative; }
.s-fill { position: absolute; left: 0; top: 0; height: 100%; background: #2a201a; }
.s-dot {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  width: 8px; height: 8px; border-radius: 50%;
  background: #2a201a;
  border: 2px solid var(--parchment);
  outline: 1px solid #2a201a;
}

.drink-tag {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 1.2rem;
}

.drink-photo {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
  min-height: 0;
  max-height: 220px;
  margin-bottom: 0.75rem;
}
.drink-photo img {
  max-width: 80%;
  max-height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}
.empty-photo {
  width: 60%; height: 140px;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0.12;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 0.75rem;
  border-top: 0.5px solid var(--rule);
  margin-top: auto;
}
.price {
  font-family: 'Libre Baskerville', serif;
  font-size: 17px;
  color: var(--text);
}
.serve-note {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ── ARROW BUTTONS ── */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 200;
  width: 42px; height: 42px;
  border: 0.5px solid var(--rule);
  border-radius: 50%;
  background: var(--parchment);
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.arrow:hover { background: var(--text); color: var(--parchment); border-color: var(--text); }
.arrow:disabled { opacity: 0.2; cursor: default; }
.arrow:disabled:hover { background: var(--parchment); color: var(--text-muted); border-color: var(--rule); }
.arrow-left  { left: 1.5rem; }
.arrow-right { right: 1.5rem; }

/* ── DOTS ── */
.dots-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--parchment);
  border-top: 0.5px solid var(--rule);
  z-index: 100;
}
.dot-btn {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #bfaf98;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: all 0.3s;
  flex-shrink: 0;
}
.dot-btn.active {
  background: var(--text);
  width: 20px;
  border-radius: 3px;
}

/* ── MOBILE ── */
@media (max-width: 600px) {
  :root { --card-w: 88vw; }
  .page-header { padding: 1.1rem 1.25rem 1rem; }
  .arrow { display: none; }
  .track-inner { padding: 0 6vw; }
}
@media (min-width: 900px) {
  :root { --card-w: 360px; }
}
@media (min-width: 1200px) {
  :root { --card-w: 400px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <span class="page-num" id="numLeft">1</span>
  <span class="page-section">Cocktails</span>
  <span class="page-num right" id="numRight">12</span>
</div>

<!-- ARROWS -->
<button class="arrow arrow-left" id="arrowLeft" onclick="scroll(-1)" aria-label="Previous">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>
<button class="arrow arrow-right" id="arrowRight" onclick="scroll(1)" aria-label="Next">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
</button>

<!-- SCROLL TRACK -->
<div class="track-wrap">
  <div class="track" id="track">
    <div class="track-inner" id="trackInner"></div>
  </div>
</div>

<!-- DOTS -->
<div class="dots-bar" id="dotsBar"></div>

<script>
const cocktails = [
  {
    name: 'Controlled Chaos', oz: '3.25 oz.',
    ingredients: 'Vodka, Elderflower Liqueur, Fresh Grapefruit Juice, Lime Juice, Honey Syrup, Chili Flake, Fresh Rosemary',
    sliders: [{l:'Level',v:62},{l:'Heat',v:72},{l:'Floral',v:55}],
    tag: 'Spicy · Floral · Bright',
    img: 'chaos.svg', serve: 'Rosemary garnish', price: '$17'
  },
  {
    name: 'Sage Smash', oz: '3.25 oz.',
    ingredients: 'Bourbon, Fresh Lemon Juice, Maple Syrup, Blackberries, Fresh Sage, Angostura Bitters, Sparkling Water',
    sliders: [{l:'Level',v:75},{l:'Tart',v:65},{l:'Herb',v:58}],
    tag: 'Deep · Herbal · Slightly Tart',
    img: 'smash.svg', serve: 'Sage leaf', price: '$18'
  },
  {
    name: 'Dark Matter', oz: '3.5 oz.',
    ingredients: 'Dark Rum, Fresh Espresso, Coffee Liqueur, Coconut Cream, Simple Syrup, Sea Salt',
    sliders: [{l:'Level',v:70},{l:'Bold',v:85},{l:'Creamy',v:60}],
    tag: 'Creamy · Bold Coffee · Tropical',
    img: 'espresso.svg', serve: '3 Espresso beans', price: '$19'
  },
  // Placeholders — fill in as you add more
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
  { name: 'Coming Soon', oz: '—', ingredients: 'Recipe coming soon.', sliders: [], tag: '· · ·', img: '', serve: '—', price: '$—' },
];

const TOTAL = cocktails.length;
const track  = document.getElementById('track');
const inner  = document.getElementById('trackInner');
const dots   = document.getElementById('dotsBar');

// Build cards
cocktails.forEach((c, i) => {
  const sliders = c.sliders.map(s => `
    <div class="s-row">
      <span class="s-label">${s.l}</span>
      <div class="s-track"><div class="s-fill" style="width:${s.v}%"></div><div class="s-dot" style="left:${s.v}%"></div></div>
    </div>`).join('');

  const photo = c.img
    ? `<div class="drink-photo"><img src="${c.img}" alt="${c.name}" loading="lazy"></div>`
    : `<div class="drink-photo"><div class="empty-photo">
        <svg width="48" height="70" viewBox="0 0 48 70" fill="none">
          <ellipse cx="24" cy="62" rx="14" ry="5" fill="#a89878" opacity="0.4"/>
          <path d="M10 62 Q10 28 24 18 Q38 28 38 62" fill="#c0b090" opacity="0.35"/>
        </svg></div></div>`;

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index = i;
  card.innerHTML = `
    <div class="drink-header">
      <p class="drink-name">${c.name}</p>
      <p class="drink-oz">${c.oz}</p>
    </div>
    <p class="drink-ingredients">${c.ingredients}</p>
    ${sliders ? `<div class="sliders">${sliders}</div>` : ''}
    <p class="drink-tag">${c.tag}</p>
    ${photo}
    <div class="price-row">
      <span class="serve-note">${c.serve}</span>
      <span class="price">${c.price}</span>
    </div>`;
  inner.appendChild(card);

  // Dot
  const dot = document.createElement('button');
  dot.className = 'dot-btn' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', `Go to ${c.name}`);
  dot.onclick = () => scrollToCard(i);
  dots.appendChild(dot);
});

// ── SCROLL LOGIC ──
let currentIndex = 0;

function getCardWidth() {
  const card = inner.querySelector('.card');
  if (!card) return 340;
  return card.offsetWidth;
}

function scrollToCard(idx) {
  idx = Math.max(0, Math.min(TOTAL - 1, idx));
  currentIndex = idx;
  const cardW = getCardWidth();
  const centerOffset = (track.offsetWidth - cardW) / 2;
  const scrollX = idx * cardW - centerOffset;
  track.scrollTo({ left: Math.max(0, scrollX), behavior: 'smooth' });
  updateUI();
}

function scroll(dir) { scrollToCard(currentIndex + dir); }

function updateUI() {
  // Dots
  document.querySelectorAll('.dot-btn').forEach((d, i) => {
    d.classList.toggle('active', i === currentIndex);
  });
  // Header numbers
  document.getElementById('numLeft').textContent = currentIndex + 1;
  document.getElementById('numRight').textContent = TOTAL;
  // Arrow states
  document.getElementById('arrowLeft').disabled  = currentIndex === 0;
  document.getElementById('arrowRight').disabled = currentIndex === TOTAL - 1;
  // Dim far cards
  document.querySelectorAll('.card').forEach((card, i) => {
    card.classList.toggle('dim', Math.abs(i - currentIndex) > 1);
  });
}

// Detect which card is centered while free-scrolling
let scrollTimer;
track.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const cardW = getCardWidth();
    const centerOffset = (track.offsetWidth - cardW) / 2;
    const idx = Math.round((track.scrollLeft + centerOffset) / cardW);
    currentIndex = Math.max(0, Math.min(TOTAL - 1, idx));
    updateUI();
  }, 60);
});

// ── DRAG TO SCROLL ──
let isDragging = false, dragStartX = 0, scrollStartX = 0;
track.addEventListener('mousedown', e => {
  isDragging = true; dragStartX = e.clientX; scrollStartX = track.scrollLeft;
  track.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  track.scrollLeft = scrollStartX - (e.clientX - dragStartX);
});
document.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  track.classList.remove('dragging');
  // Snap to nearest after drag
  const cardW = getCardWidth();
  const centerOffset = (track.offsetWidth - cardW) / 2;
  const idx = Math.round((track.scrollLeft + centerOffset) / cardW);
  scrollToCard(idx);
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') scroll(1);
  if (e.key === 'ArrowLeft')  scroll(-1);
});

// Init
updateUI();
</script>
</body>
</html>
