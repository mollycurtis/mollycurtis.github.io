<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktail Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Barlow:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --parchment: #eee8d8;
  --ink: #090705;
  --rule: rgba(168,152,120,0.45);
  --rule-strong: #a89878;
  --text: #18140f;
  --text-mid: #332a1c;
  --text-muted: #8a7a62;
  --gold: rgba(200,169,110,0.88);

  --sp-1: 0.3rem;
  --sp-2: 0.55rem;
  --sp-3: 0.9rem;
  --sp-4: 1.4rem;
  --sp-5: 2.2rem;
  --sp-6: 3.5rem;

  --card-w: 340px;
  --ease-luxury: cubic-bezier(0.22, 0.6, 0.36, 1);
}

html { scroll-behavior: smooth; }
body {
  background: var(--ink);
  font-family: 'Barlow', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
}

/* ══════════════
   HERO
══════════════ */
.hero {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: clamp(280px, 40vh, 500px);
  padding: clamp(1.5rem, 4vw, 4.5rem) clamp(1.5rem, 5vw, 5rem) clamp(1.75rem, 3.5vw, 3.5rem);
  position: relative;
  overflow: hidden;
  /* richer cinematic background */
  background:
    radial-gradient(ellipse 75% 65% at 52% 42%, rgba(155,82,18,0.19) 0%, transparent 60%),
    radial-gradient(ellipse 45% 45% at 12% 72%, rgba(85,42,8,0.13) 0%, transparent 65%),
    radial-gradient(ellipse 30% 30% at 85% 20%, rgba(100,55,10,0.07) 0%, transparent 60%),
    linear-gradient(168deg, #130e07 0%, #0a0806 45%, #080604 100%);
  /* subtle warm bottom edge bleeding into parchment */
  border-bottom: 1px solid rgba(168,152,120,0.1);
}

/* grain */
.hero::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.22; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
}

/* vignette — softer blend */
.hero::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 85% 75% at 50% 50%, transparent 25%, rgba(5,3,2,0.55) 100%),
    linear-gradient(to bottom, rgba(5,3,2,0.2) 0%, transparent 30%, transparent 70%, rgba(5,3,2,0.15) 100%);
}

.hero-nav {
  position: absolute;
  top: clamp(1rem, 2.5vw, 1.75rem);
  left: clamp(1.5rem, 5vw, 5rem);
  right: clamp(1.5rem, 5vw, 5rem);
  z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(0.85rem, 1.1vw, 0.98rem);
  letter-spacing: 0.06em;
  color: rgba(238,232,216,0.72);
  text-decoration: none;
  transition: color 0.3s;
}
.nav-logo:hover { color: rgba(238,232,216,0.95); }
.nav-back {
  font-size: 0.58rem; letter-spacing: 0.26em; text-transform: uppercase;
  color: rgba(238,232,216,0.45); text-decoration: none; transition: color 0.3s;
}
.nav-back:hover { color: rgba(238,232,216,0.82); }

.hero-bottom {
  position: relative; z-index: 5;
  display: flex; flex-direction: column;
  align-items: flex-start;
  width: 100%;
  max-width: 1380px;
  animation: fadeUp 1.1s var(--ease-luxury) 0.15s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.hero-eyebrow {
  display: flex; align-items: center; gap: 0.7rem;
  font-size: 0.56rem; letter-spacing: 0.42em; text-transform: uppercase;
  color: var(--gold);
  font-family: 'Barlow', sans-serif; font-weight: 300;
  margin-bottom: var(--sp-4);
}
.hero-eyebrow::before {
  content: ''; width: 24px; height: 0.5px;
  background: rgba(200,169,110,0.38); display: inline-block; flex-shrink: 0;
}

.hero-body {
  display: flex;
  align-items: center;
  gap: clamp(2rem, 5vw, 5.5rem);
  width: 100%;
}
.hero-left { flex-shrink: 0; }

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 6.2vw, 5.8rem);
  font-weight: 300;
  line-height: 0.9;
  letter-spacing: -0.03em;
  color: rgba(238,232,216,0.97);
  text-align: left;
}

.hero-right {
  flex: 1;
  max-width: clamp(300px, 36vw, 560px);
}
.hero-desc {
  font-size: clamp(0.85rem, 1.05vw, 0.97rem);
  font-weight: 300;
  line-height: 1.88;
  color: rgba(238,232,216,0.52);
  font-family: 'Barlow', sans-serif;
  text-align: left;
}

.hero-scroll {
  position: absolute; bottom: var(--sp-5); right: clamp(1.5rem, 5vw, 5rem);
  z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
}
.hero-scroll span {
  font-size: 0.48rem; letter-spacing: 0.38em; text-transform: uppercase;
  color: rgba(238,232,216,0.14); writing-mode: vertical-rl;
}
.scroll-line {
  width: 1px; height: 40px;
  background: linear-gradient(to bottom, rgba(200,169,110,0.3), transparent);
  animation: scrollPulse 3s ease-in-out infinite;
}
@keyframes scrollPulse { 0%,100%{opacity:0.25} 50%{opacity:0.9} }

@media (max-width: 700px) {
  .hero {
    min-height: clamp(220px, 44vh, 380px);
    padding: clamp(5rem, 12vh, 7rem) 1.5rem clamp(1.25rem, 3.5vh, 2rem);
    justify-content: center;
  }
  .hero-nav { top: 1rem; left: 1.25rem; right: 1.25rem; }
  .hero-body { flex-direction: column; align-items: flex-start; gap: var(--sp-3); }
  .hero-left, .hero-right { width: 100%; max-width: 100%; min-width: 0; }
  .hero-title, .hero-desc, .hero-eyebrow { text-align: left; }
  .hero-desc { color: rgba(238,232,216,0.56); }
  .hero-scroll { display: none; }
}

@media (min-width: 2000px) {
  .hero { max-width: 1800px; margin: 0 auto; }
  .hero-right { max-width: 520px; }
  .hero-title { font-size: 5rem; }
}

/* ══════════════
   MENU
══════════════ */
.menu { background: var(--parchment); position: relative; }

.menu-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; justify-content: center; align-items: center;
  padding: 0.9rem clamp(1.5rem, 4vw, 3rem);
  border-bottom: 0.5px solid var(--rule-strong);
  background: var(--parchment);
  /* subtle warmth shadow */
  box-shadow: 0 1px 16px rgba(168,152,120,0.08), 0 2px 4px rgba(0,0,0,0.03);
}
.menu-label {
  font-size: 9px; letter-spacing: 0.52em; text-transform: uppercase;
  color: var(--text-muted); opacity: 0.6;
  font-family: 'Barlow', sans-serif;
}

.track-outer { height: calc(90vh - 44px); overflow: hidden; position: relative; }
.track { display: flex; height: 100%; overflow: hidden; padding-bottom: 52px; }
.track-inner {
  display: flex; align-items: stretch;
  /* smoother luxury easing */
  transition: transform 0.42s cubic-bezier(0.16, 0.84, 0.44, 1);
  will-change: transform;
}

/* ── CARD ── */
.card {
  width: var(--card-w);
  flex-shrink: 0; overflow: hidden;
  display: flex; flex-direction: column;
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  border-right: 0.5px solid var(--rule);
  background: var(--parchment);
  /* very subtle inner atmosphere */
  background-image: radial-gradient(ellipse 80% 40% at 50% 100%, rgba(168,152,120,0.04) 0%, transparent 100%);
}
.card:last-child { border-right: none; }
/* Raised image positioning for specific drinks */
.card--raise-img .drink-photo {
  align-items: center;
  padding-bottom: 0.5rem;
}
.card--raise-img .drink-photo img {
  object-position: center center;
}
.card:first-child { margin-left: 0; }
/* Subtle alternating warmth — barely perceptible, adds editorial rhythm */
.card:nth-child(even) {
  background: #ece6d4;
  background-image: radial-gradient(ellipse 80% 40% at 50% 100%, rgba(168,152,120,0.05) 0%, transparent 100%);
}

.drink-header {
  padding-bottom: var(--sp-3);
  border-bottom: 0.5px solid var(--rule-strong);
  margin-bottom: var(--sp-3);
  flex-shrink: 0;
}
.drink-name {
  font-family: 'Libre Baskerville', serif;
  font-weight: 700;
  font-size: clamp(15px, 1.35vw, 19px);
  line-height: 1.15;
  color: var(--text);
  margin-bottom: 3px;
  letter-spacing: -0.012em;
}
.drink-oz {
  font-size: 9.5px; color: var(--text-muted);
  letter-spacing: 0.14em; font-family: 'Barlow', sans-serif;
}

.drink-ingredients {
  font-size: 12px; font-weight: 300;
  color: var(--text-mid);
  line-height: 1.72;
  margin-bottom: var(--sp-3);
  flex-shrink: 0;
  letter-spacing: 0.01em;
}

.sliders { display: flex; flex-direction: column; gap: 7px; margin-bottom: var(--sp-3); flex-shrink: 0; }
.s-row { display: flex; align-items: center; gap: 8px; }
.s-label {
  font-size: 7px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-muted); width: 34px; flex-shrink: 0; opacity: 0.8;
  font-family: 'Barlow', sans-serif;
}
.s-track {
  flex: 1; height: 1px;
  background: rgba(168,152,120,0.32);
  position: relative; border-radius: 1px;
}
.s-fill {
  position: absolute; left: 0; top: 0; height: 100%;
  background: linear-gradient(90deg, rgba(58,46,32,0.7), #2a201a);
  border-radius: 1px;
}
.s-dot {
  position: absolute; top: 50%;
  transform: translate(-50%,-50%);
  width: 6.5px; height: 6.5px;
  border-radius: 50%;
  background: #2a201a;
  border: 1.5px solid var(--parchment);
  outline: 1px solid rgba(42,32,26,0.45);
  box-shadow: 0 1px 5px rgba(0,0,0,0.16), 0 0 0 1px rgba(42,32,26,0.08);
}

.drink-tag {
  font-size: 7.5px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 0;
  flex-shrink: 0; opacity: 0.75;
  font-family: 'Barlow', sans-serif;
}

.drink-photo {
  flex: 1; min-height: 0; max-height: 340px;
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
  margin-top: var(--sp-1);
  margin-bottom: var(--sp-2);
}
.drink-photo img {
  width: auto; max-width: 90%; max-height: 100%;
  object-fit: contain; object-position: center bottom; display: block;
  -webkit-transform: translateZ(0); transform: translateZ(0);
  isolation: isolate;
}
.empty-photo {
  opacity: 0.1; display: flex; align-items: flex-end;
  justify-content: center; width: 55%; height: 90px;
}

.price-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-top: var(--sp-3);
  border-top: 0.5px solid var(--rule-strong);
  margin-top: auto; flex-shrink: 0;
}
.price {
  font-family: 'Libre Baskerville', serif;
  font-size: clamp(13px, 1.1vw, 16px);
  color: var(--text);
}
.serve-note {
  font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-muted); font-family: 'Barlow', sans-serif;
}

/* ── ARROWS ── */
.arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 300; width: 46px; height: 46px;
  border: 1px solid rgba(26,20,15,0.45); border-radius: 50%;
  background: rgba(238,232,216,0.95); color: var(--text);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.22s var(--ease-luxury), color 0.22s, border-color 0.22s, transform 0.22s;
  box-shadow: 0 2px 18px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.08);
}
.arrow:hover {
  background: var(--text); color: var(--parchment); border-color: var(--text);
  transform: translateY(-50%) scale(1.05);
}
.arrow:disabled { opacity: 0.2; cursor: default; }
.arrow:disabled:hover { background: rgba(238,232,216,0.95); color: var(--text); transform: translateY(-50%) scale(1); }
.arrow-left  { left: 1.1rem; }
.arrow-right { right: 1.1rem; }

/* ── DOTS ── */
.dots-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--parchment);
  border-top: 0.5px solid rgba(168,152,120,0.3);
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.45s;
  box-shadow: 0 -1px 12px rgba(168,152,120,0.06);
}
.dots-bar.show { opacity: 1; pointer-events: auto; }
.dot-btn {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(168,152,120,0.45); border: none; cursor: pointer; padding: 0;
  transition: all 0.32s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.dot-btn.active { background: var(--text); width: 15px; border-radius: 2.5px; }

.mobile-nav-btn {
  display: none;
  background: none;
  border: 1px solid rgba(168,152,120,0.5);
  border-radius: 50%;
  width: 29px; height: 29px;
  color: var(--text); cursor: pointer; padding: 0;
  flex-shrink: 0; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.mobile-nav-btn:hover { background: var(--text); color: var(--parchment); border-color: var(--text); }
.dots-inner { display: flex; align-items: center; gap: 6px; }

/* ── BREAKPOINTS ── */
@media (max-width: 600px) {
  :root { --card-w: 100vw; }
  .arrow { display: none; }
  .mobile-nav-btn { display: flex; align-items: center; }
  .card { padding: 1.5rem 1.5rem 1.2rem; border-right: none; }
  .track-outer { height: calc(78vh - 44px); }
  .drink-photo { height: 240px; max-height: none; flex: none; margin-top: 0; margin-bottom: var(--sp-1); }
  .drink-photo img { width: 96%; max-height: 240px; }
}
@media (max-width: 600px) and (max-height: 700px) {
  .track-outer { height: calc(72vh - 44px); }
  .drink-photo { height: 195px; }
  .drink-photo img { max-height: 195px; width: 94%; }
  .drink-tag { margin-bottom: 0; }
}
@media (min-width: 601px) and (max-width: 900px)   { :root { --card-w: 340px; } }
@media (min-width: 901px) and (max-width: 1199px)  { :root { --card-w: 358px; } }
@media (min-width: 1200px) and (max-width: 1599px) { :root { --card-w: 398px; } }
@media (min-width: 1600px) and (max-width: 1999px) { :root { --card-w: 428px; } }
@media (min-width: 2000px) { :root { --card-w: 458px; } }
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <nav class="hero-nav">
    <a href="https://mollycurtis.github.io" class="nav-logo">Molly Curtis</a>
    <a href="https://mollycurtis.github.io/editorialconcepts/" class="nav-back">← Visual Concepts</a>
  </nav>

  <div class="hero-bottom">
    <p class="hero-eyebrow">Visual Concept · Hospitality</p>
    <div class="hero-body">
      <div class="hero-left">
        <h1 class="hero-title" style="text-align:left;width:100%;">Cocktail Menu</h1>
      </div>
      <div class="hero-right">
        <p class="hero-desc">Inspired by previous experience in hospitality and bartending, this concept explores cocktail storytelling through cinematic presentation, editorial-inspired layouts, and immersive visual direction.</p>
      </div>
    </div>
  </div>

  <div class="hero-scroll">
    <div class="scroll-line"></div>
    <span>Scroll</span>
  </div>
</section>

<!-- MENU -->
<section class="menu" id="menu" style="position:relative;">
  <div class="menu-header">
    <span class="menu-label">Cocktails</span>
  </div>
  <div class="track-outer">
    <div class="track" id="track">
      <div class="track-inner" id="trackInner"></div>
    </div>
  </div>
  <button class="arrow arrow-left"  id="arrowL" onclick="go(-1)" aria-label="Previous">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <button class="arrow arrow-right" id="arrowR" onclick="go(1)"  aria-label="Next">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>

</section>

<div class="dots-bar" id="dots">
  <button class="mobile-nav-btn" id="mobilePrev" onclick="go(-1)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="dots-inner" id="dotsInner"></div>
  <button class="mobile-nav-btn" id="mobileNext" onclick="go(1)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script>
const cocktails = [
  { name:'Controlled Chaos', oz:'3.25 oz.', ingredients:'Vodka, Elderflower Liqueur, Grapefruit Juice, Lime Juice, Honey Syrup, Chili Flake, Rosemary',          sliders:[{l:'Level',v:62},{l:'Heat',v:72},{l:'Floral',v:55}],  tag:'Spicy · Floral · Bright',            img:'chaos.svg',       serve:'Rosemary garnish',    price:'$18' },
  { name:'Sage Smash',       oz:'3.25 oz.', ingredients:'Bourbon, Lemon Juice, Maple Syrup, Blackberries, Fresh Sage, Angostura Bitters, Sparkling Water',       sliders:[{l:'Level',v:75},{l:'Tart',v:65},{l:'Herb',v:58}],    tag:'Deep · Herbal · Slightly Tart',      img:'smash.svg',       serve:'Sage leaf',           price:'$19' },
  { name:'Dark Matter',      oz:'3.5 oz.',  ingredients:'Dark Rum, Espresso, Coffee Liqueur, Coconut Cream, Simple Syrup, Sea Salt',                             sliders:[{l:'Level',v:70},{l:'Bold',v:85},{l:'Creamy',v:60}],  tag:'Creamy · Bold Coffee · Tropical',    img:'espresso.svg',    serve:'3 Espresso beans',    price:'$20' },
  { name:'Golden Hour',      oz:'3.25 oz.', ingredients:'Vanilla Vodka, Pear Liqueur, Lemon Juice, Half & Half, Cardamom Bitters, Egg Whites',                   sliders:[{l:'Rich',v:78},{l:'Sweet',v:65},{l:'Spice',v:35}],   tag:'Silky · Aromatic · Dessert-Forward', img:'pear.svg',        serve:'Cardamom dust',       price:'$19' },
  { name:'Green Room',    oz:'3.25 oz.', ingredients:'White Rum, Matcha Powder, Lime Juice, Simple Syrup, Coconut Cream, Soda Water, Salt',                   sliders:[{l:'Fresh',v:70},{l:'Earthy',v:60},{l:'Citrus',v:55}],tag:'Tropical · Earthy · Light',           img:'matcha.svg',      serve:'Toasted coconut',     price:'$18' },
  { name:'Penicillin',       oz:'3.5 oz.',  ingredients:'Blended Scotch, Lemon Juice, Honey Ginger Syrup, Islay Scotch, Aroma Spray',                           sliders:[{l:'Smoke',v:72},{l:'Citrus',v:65},{l:'Heat',v:50}],  tag:'Smoky · Medicinal · Complex',        img:'penicillin.svg',  serve:'Lemon twist',         price:'$22' },
  { name:'Cooling Point',     oz:'3.0 oz.',  ingredients:'Vodka or Gin, Elderflower, Cucumber, Lime Juice, Simple Syrup, Soda Water',                             sliders:[{l:'Fresh',v:80},{l:'Floral',v:72},{l:'Light',v:68}], tag:'Crisp · Floral · Refreshing',        img:'elderflower.svg', serve:'Cucumber slice',      price:'$18' },
  { name:'After Hours',oz:'3.25 oz.', ingredients:'Whiskey, Lemon Juice, Cherry Syrup, Balsamic Vinegar, Egg White, Bitters',                             sliders:[{l:'Tart',v:75},{l:'Depth',v:68},{l:'Smoke',v:40}],   tag:'Bold · Tangy · Velvety',             img:'cherry.svg',      serve:'Luxardo cherry',      price:'$20' },
  { name:'Peach Reverie',    oz:'3.5 oz.',  ingredients:'Bourbon, Peach Purée, Muddled Peach, Lemon Juice, Thyme Honey Syrup, Egg Whites, Bitters, Soda Water', sliders:[{l:'Fruity',v:82},{l:'Floral',v:60},{l:'Warm',v:55}], tag:'Sun-Warmed · Herbaceous · Smooth',   img:'peach.svg',       serve:'Torched peach slices', price:'$19' },
];

const TOTAL = cocktails.length;
const inner = document.getElementById('trackInner');
const dots  = document.getElementById('dots');
  const dotsInner = document.getElementById('dotsInner') || dots;
let cur = 0;

// Build cards
cocktails.forEach((c, i) => {
  const sliders = c.sliders.map(s=>`
    <div class="s-row"><span class="s-label">${s.l}</span>
    <div class="s-track"><div class="s-fill" style="width:${s.v}%"></div><div class="s-dot" style="left:${s.v}%"></div></div></div>`).join('');
  const photo = c.img
    ? `<div class="drink-photo"><img src="${c.img}" alt="${c.name}" loading="lazy"></div>`
    : `<div class="drink-photo"><div class="empty-photo"><svg width="44" height="64" viewBox="0 0 44 64" fill="none"><ellipse cx="22" cy="57" rx="12" ry="4" fill="#a89878" opacity="0.4"/><path d="M10 57 Q10 26 22 17 Q34 26 34 57" fill="#c0b090" opacity="0.3"/></svg></div></div>`;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.i = i;
  // Drinks that need elevated image positioning
  if ([4, 6, 7, 8].includes(i)) card.classList.add('card--raise-img');
  card.innerHTML = `<div class="drink-header"><p class="drink-name">${c.name}</p><p class="drink-oz">${c.oz}</p></div>
    <p class="drink-ingredients">${c.ingredients}</p>
    ${sliders ? `<div class="sliders">${sliders}</div>` : ''}
    <p class="drink-tag">${c.tag}</p>${photo}
    <div class="price-row"><span class="serve-note">${c.serve}</span><span class="price">${c.price}</span></div>`;
  inner.appendChild(card);

  const d = document.createElement('button');
  d.className = 'dot-btn' + (i===0 ? ' active' : '');
  d.onclick = () => goTo(i);
  (document.getElementById("dotsInner") || dots).appendChild(d);
});

function goTo(idx) {
  idx = Math.max(0, Math.min(TOTAL - 1, idx));
  cur = idx;
  const cardW = inner.querySelector('.card').offsetWidth;
  inner.style.transform = `translateX(${-idx * cardW}px)`;
  updateUI();
}

function go(dir) { if (dir > 0 && cur >= TOTAL - 1) return; if (dir < 0 && cur <= 0) return; goTo(cur + dir); }

function setTrackWidth() {
  const card = inner.querySelector('.card');
  if (!card) return;
  const cardW = card.offsetWidth;
  const totalWidth = cardW * TOTAL;
  inner.style.width = `${totalWidth}px`;
  inner.style.minWidth = `${totalWidth}px`;
  inner.style.maxWidth = `${totalWidth}px`;
}

function updateUI(maxIndexOverride) {
  const cardW = inner.querySelector('.card')?.offsetWidth || 1;
  const totalWidth = inner.scrollWidth;
  const viewportWidth = document.getElementById('track').offsetWidth;
  const maxIndex = maxIndexOverride ?? Math.ceil((totalWidth - viewportWidth) / cardW);

  document.querySelectorAll('.dot-btn').forEach((d, i) => d.classList.toggle('active', i === cur));

  const atStart = cur <= 0;
  const atEnd = cur >= maxIndex;

  if (window.innerWidth > 600) {
    document.getElementById('arrowL').disabled = atStart;
    document.getElementById('arrowR').disabled = atEnd;
  }
  const mp = document.getElementById('mobilePrev');
  const mn = document.getElementById('mobileNext');
  if (mp) mp.style.opacity = atStart ? '0.25' : '1';
  if (mn) mn.style.opacity = atEnd ? '0.25' : '1';
}

// Touch swipe
let tx = 0;
document.getElementById('track').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.getElementById('track').addEventListener('touchend', e => {
  const diff = tx - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 40) go(diff > 0 ? 1 : -1);
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft')  go(-1);
});

// Show dots when menu in view
const obs = new IntersectionObserver(entries => {
  dots.classList.toggle('show', entries[0].isIntersecting);
}, { threshold: 0.05 });
obs.observe(document.getElementById('menu'));

updateUI();
setTrackWidth();
window.addEventListener('resize', () => { setTrackWidth(); goTo(cur); });
</script>
</body>
</html>
