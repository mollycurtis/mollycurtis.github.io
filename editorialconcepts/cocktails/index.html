<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktail Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Barlow:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --parchment: #eee8d8;
  --ink: #0a0806;
  --rule: #a89878;
  --text: #1a1510;
  --text-mid: #3a2e20;
  --text-muted: #8a7a62;
  --card-w: 340px;
}

html { scroll-behavior: smooth; }
body { background: var(--ink); font-family: 'Barlow', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

/* ── HERO ── */
.hero {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 2rem clamp(2rem, 5vw, 5rem) 3.5rem;
  min-height: 42vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 65% 50% at 60% 40%, rgba(140,75,15,0.15) 0%, transparent 65%),
    radial-gradient(ellipse 40% 35% at 15% 70%, rgba(90,45,10,0.1) 0%, transparent 65%),
    linear-gradient(170deg, #100c06 0%, #0a0806 50%, #080604 100%);
}

/* grain */
.hero::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.28; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
}

/* vignette */
.hero::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 35%, rgba(5,3,2,0.65) 100%);
}

.hero-nav {
  position: absolute;
  top: 2rem; left: clamp(2rem, 5vw, 5rem); right: clamp(2rem, 5vw, 5rem);
  z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  width: auto;
}
.nav-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95rem; letter-spacing: 0.06em;
  color: rgba(238,232,216,0.75); text-decoration: none;
}
.nav-back {
  font-size: 0.6rem; letter-spacing: 0.24em; text-transform: uppercase;
  color: rgba(238,232,216,0.55); text-decoration: none; transition: color 0.3s;
}
.nav-back:hover { color: rgba(238,232,216,0.6); }

.hero-body {
  position: relative; z-index: 5;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: clamp(2rem, 4vw, 4rem);
  max-width: 1300px;
  width: 100%;
  animation: fadeUp 1.2s cubic-bezier(0.25,0.46,0.45,0.94) 0.2s both;
}
.hero-eyebrow {
  max-width: 1400px;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

.hero-left {}

.hero-eyebrow {
  display: flex; align-items: center; gap: 0.75rem;
  font-size: 0.58rem; letter-spacing: 0.4em; text-transform: uppercase;
  color: rgba(200,169,110,0.85); margin-bottom: 0.8rem;
  font-family: 'Barlow', sans-serif; font-weight: 300;
  position: relative; z-index: 5;
}
.hero-eyebrow::before {
  content: ''; width: 28px; height: 0.5px;
  background: rgba(200,169,110,0.35); display: inline-block;
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3.5rem, 7vw, 6.5rem);
  font-weight: 300; line-height: 0.92;
  letter-spacing: -0.02em;
  color: rgba(238,232,216,0.95);
}

.hero-right {
  flex: 1;
  max-width: 620px;
  margin-left: 4vw;
}
.hero-desc {
  font-size: 0.88rem; font-weight: 300; line-height: 1.75;
  color: rgba(238,232,216,0.42);
  font-family: 'Barlow', sans-serif;
}

/* scroll cue */
.hero-scroll {
  position: absolute; bottom: 2.5rem; right: 3rem; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
}
.hero-scroll span {
  font-size: 0.5rem; letter-spacing: 0.38em; text-transform: uppercase;
  color: rgba(238,232,216,0.16); writing-mode: vertical-rl;
}
.scroll-line {
  width: 1px; height: 44px;
  background: linear-gradient(to bottom, rgba(200,169,110,0.28), transparent);
  animation: scrollPulse 2.8s ease-in-out infinite;
}
@keyframes scrollPulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

@media (max-width: 700px) {
  .hero { padding: 4rem 1.5rem 2rem; min-height: 0; justify-content: flex-end; }
  .hero-body { flex-direction: column; gap: 0.9rem; }
  .hero-right { max-width: 100%; margin-left: 0; }
  .hero-title { font-size: clamp(2.6rem, 11vw, 4rem); }
  .hero-scroll { display: none; }
  .hero-nav { top: 1rem; left: 1.5rem; right: 1.5rem; }
}

/* ── MENU ── */
.menu {
  background: var(--parchment);
  position: relative;
}

.menu-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; justify-content: center; align-items: center;
  padding: 1.1rem clamp(1.5rem, 4vw, 3rem);
  border-bottom: 0.5px solid var(--rule);
  background: var(--parchment);
}
.menu-label { font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--text-muted); opacity: 0.7; }

/* scroll track — height = viewport minus sticky header */
.track-outer { height: calc(90vh - 48px); overflow: hidden; position: relative; }

.track {
  display: flex; height: 100%;
  overflow: hidden;
  padding-bottom: 54px;
}

.track-inner {
  display: flex; align-items: stretch;
  transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

/* ── CARD ── */
.card {
  width: var(--card-w); flex-shrink: 0; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 2rem 1.75rem 1.5rem;
  border-right: 0.5px solid var(--rule);
  background: var(--parchment);
  transition: opacity 0.4s;
}
.card:last-child { border-right: none; }
.card:first-child { margin-left: 0; }


.drink-header { padding-bottom: 0.9rem; border-bottom: 0.5px solid var(--rule); margin-bottom: 0.9rem; }
.drink-name { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 20px; line-height: 1.15; color: var(--text); margin-bottom: 5px; }
.drink-oz { font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; }
.drink-ingredients { font-size: 13px; font-weight: 300; color: var(--text-mid); line-height: 1.65; margin-bottom: 1.1rem; }

.sliders { display: flex; flex-direction: column; gap: 9px; margin-bottom: 1.1rem; }
.s-row { display: flex; align-items: center; gap: 9px; }
.s-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); width: 38px; flex-shrink: 0; }
.s-track { flex: 1; height: 1px; background: #bfaf98; position: relative; }
.s-fill { position: absolute; left: 0; top: 0; height: 100%; background: #2a201a; }
.s-dot { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; border-radius: 50%; background: #2a201a; border: 2px solid var(--parchment); outline: 1px solid #2a201a; }

.drink-tag { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1rem; }

.drink-photo { flex: 1; min-height: 0; max-height: 380px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; margin-top: 0.5rem; margin-bottom: 0.5rem; }
.drink-photo img {
  width: auto; max-width: 100%; max-height: 100%;
  object-fit: contain; object-position: center bottom; display: block;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
  isolation: isolate;
}
.empty-photo { opacity: 0.1; display: flex; align-items: flex-end; justify-content: center; width: 60%; height: 110px; }

.price-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 0.75rem; border-top: 0.5px solid var(--rule); margin-top: auto; }
.price { font-family: 'Libre Baskerville', serif; font-size: 17px; color: var(--text); }
.serve-note { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }

/* ── ARROWS — only inside menu ── */
.arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 300; width: 52px; height: 52px;
  border: 1px solid var(--text); border-radius: 50%;
  background: var(--parchment); color: var(--text);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.22s, color 0.22s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
}
.arrow:hover { background: var(--text); color: var(--parchment); }
.arrow:disabled { opacity: 0.25; cursor: default; }
.arrow:disabled:hover { background: var(--parchment); color: var(--text); border-color: var(--text); }
.arrow-left  { left: 1rem; }
.arrow-right { right: 1.5rem; }

/* ── DOTS ── */
.dots-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--parchment); border-top: 0.5px solid var(--rule);
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s;
}
.dots-bar.show { opacity: 1; pointer-events: auto; }
.dot-btn {
  width: 6px; height: 6px; border-radius: 50%;
  background: #bfaf98; border: none; cursor: pointer; padding: 0;
  transition: all 0.28s;
}
.dot-btn.active { background: var(--text); width: 18px; border-radius: 3px; }

@media (max-width: 600px) {
  :root { --card-w: 88vw; }


  .track-outer { height: calc(75vh - 48px); }
}
@media (max-width: 600px) and (max-height: 700px) {
  .track-outer { height: calc(70vh - 48px); }
}
@media (min-width: 900px)  { :root { --card-w: 360px; } }
@media (min-width: 1200px) { :root { --card-w: 400px; } }
@media (min-width: 1600px) { :root { --card-w: 430px; } }
@media (min-width: 2000px) { :root { --card-w: 460px; } }

.mobile-nav-btn {
  display: none;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 50%;
  width: 32px; height: 32px;
  color: var(--text); cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  align-items: center; justify-content: center;
  transition: all 0.2s;
}
.mobile-nav-btn:hover { background: var(--text); color: var(--parchment); }
.dots-inner { display: flex; align-items: center; gap: 7px; }
@media (max-width: 600px) {
  .mobile-nav-btn { display: flex; align-items: center; }
}

@media (max-width: 600px) {
  .arrow { display: none; }
}

.hero-bottom {
  position: relative; z-index: 5;
  display: flex; flex-direction: column;
  gap: 0;
  width: 100%;
}
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <nav class="hero-nav">
    <a href="https://mollycurtis.github.io" class="nav-logo">Molly Curtis</a>
    <a href="https://mollycurtis.github.io/visualconcepts/" class="nav-back">← Visual Concepts</a>
  </nav>

  <div class="hero-bottom">
    <p class="hero-eyebrow">Visual Concept · Hospitality</p>
    <div class="hero-body">
      <div class="hero-left">
        <h1 class="hero-title">Cocktail Menu</h1>
      </div>
      <div class="hero-right">
        <p class="hero-desc">Inspired by previous experience in hospitality and bartending, this concept explores cocktail storytelling through cinematic presentation, editorial-inspired layouts, and immersive visual direction.</p>
      </div>
    </div>
  </div>

  <div class="hero-scroll">
    <div class="scroll-line"></div>
    <span>Scroll</span>
  </div>
</section>

<!-- MENU -->
<section class="menu" id="menu" style="position:relative;">
  <div class="menu-header">
    <span class="menu-label">Cocktails</span>
  </div>
  <div class="track-outer">
    <div class="track" id="track">
      <div class="track-inner" id="trackInner"></div>
    </div>
  </div>
  <button class="arrow arrow-left"  id="arrowL" onclick="go(-1)" aria-label="Previous">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <button class="arrow arrow-right" id="arrowR" onclick="go(1)"  aria-label="Next">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>

</section>

<div class="dots-bar" id="dots">
  <button class="mobile-nav-btn" id="mobilePrev" onclick="go(-1)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="dots-inner" id="dotsInner"></div>
  <button class="mobile-nav-btn" id="mobileNext" onclick="go(1)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script>
const cocktails = [
  { name:'Controlled Chaos', oz:'3.25 oz.', ingredients:'Vodka, Elderflower Liqueur, Grapefruit Juice, Lime Juice, Honey Syrup, Chili Flake, Rosemary',          sliders:[{l:'Level',v:62},{l:'Heat',v:72},{l:'Floral',v:55}],  tag:'Spicy · Floral · Bright',            img:'chaos.svg',       serve:'Rosemary garnish',    price:'$18' },
  { name:'Sage Smash',       oz:'3.25 oz.', ingredients:'Bourbon, Lemon Juice, Maple Syrup, Blackberries, Fresh Sage, Angostura Bitters, Sparkling Water',       sliders:[{l:'Level',v:75},{l:'Tart',v:65},{l:'Herb',v:58}],    tag:'Deep · Herbal · Slightly Tart',      img:'smash.svg',       serve:'Sage leaf',           price:'$19' },
  { name:'Dark Matter',      oz:'3.5 oz.',  ingredients:'Dark Rum, Espresso, Coffee Liqueur, Coconut Cream, Simple Syrup, Sea Salt',                             sliders:[{l:'Level',v:70},{l:'Bold',v:85},{l:'Creamy',v:60}],  tag:'Creamy · Bold Coffee · Tropical',    img:'espresso.svg',    serve:'3 Espresso beans',    price:'$20' },
  { name:'Golden Hour',      oz:'3.25 oz.', ingredients:'Vanilla Vodka, Pear Liqueur, Lemon Juice, Half & Half, Cardamom Bitters, Egg Whites',                   sliders:[{l:'Rich',v:78},{l:'Sweet',v:65},{l:'Spice',v:35}],   tag:'Silky · Aromatic · Dessert-Forward', img:'pear.svg',        serve:'Cardamom dust',       price:'$19' },
  { name:'Green Room',    oz:'3.25 oz.', ingredients:'White Rum, Matcha Powder, Lime Juice, Simple Syrup, Coconut Cream, Soda Water, Salt',                   sliders:[{l:'Fresh',v:70},{l:'Earthy',v:60},{l:'Citrus',v:55}],tag:'Tropical · Earthy · Light',           img:'matcha.svg',      serve:'Toasted coconut',     price:'$18' },
  { name:'Penicillin',       oz:'3.5 oz.',  ingredients:'Blended Scotch, Lemon Juice, Honey Ginger Syrup, Islay Scotch, Aroma Spray',                           sliders:[{l:'Smoke',v:72},{l:'Citrus',v:65},{l:'Heat',v:50}],  tag:'Smoky · Medicinal · Complex',        img:'penicillin.svg',  serve:'Lemon twist',         price:'$22' },
  { name:'Cooling Point',     oz:'3.0 oz.',  ingredients:'Vodka or Gin, Elderflower, Cucumber, Lime Juice, Simple Syrup, Soda Water',                             sliders:[{l:'Fresh',v:80},{l:'Floral',v:72},{l:'Light',v:68}], tag:'Crisp · Floral · Refreshing',        img:'elderflower.svg', serve:'Cucumber slice',      price:'$18' },
  { name:'After Hours',oz:'3.25 oz.', ingredients:'Whiskey, Lemon Juice, Cherry Syrup, Balsamic Vinegar, Egg White, Bitters',                             sliders:[{l:'Tart',v:75},{l:'Depth',v:68},{l:'Smoke',v:40}],   tag:'Bold · Tangy · Velvety',             img:'cherry.svg',      serve:'Luxardo cherry',      price:'$20' },
  { name:'Peach Reverie',    oz:'3.5 oz.',  ingredients:'Bourbon, Peach Purée, Muddled Peach, Lemon Juice, Thyme Honey Syrup, Egg Whites, Bitters, Soda Water', sliders:[{l:'Fruity',v:82},{l:'Floral',v:60},{l:'Warm',v:55}], tag:'Sun-Warmed · Herbaceous · Smooth',   img:'peach.svg',       serve:'Torched peach slices', price:'$19' },
];

const TOTAL = cocktails.length;
const inner = document.getElementById('trackInner');
const dots  = document.getElementById('dots');
  const dotsInner = document.getElementById('dotsInner') || dots;
let cur = 0;

// Build cards
cocktails.forEach((c, i) => {
  const sliders = c.sliders.map(s=>`
    <div class="s-row"><span class="s-label">${s.l}</span>
    <div class="s-track"><div class="s-fill" style="width:${s.v}%"></div><div class="s-dot" style="left:${s.v}%"></div></div></div>`).join('');
  const photo = c.img
    ? `<div class="drink-photo"><img src="${c.img}" alt="${c.name}" loading="lazy"></div>`
    : `<div class="drink-photo"><div class="empty-photo"><svg width="44" height="64" viewBox="0 0 44 64" fill="none"><ellipse cx="22" cy="57" rx="12" ry="4" fill="#a89878" opacity="0.4"/><path d="M10 57 Q10 26 22 17 Q34 26 34 57" fill="#c0b090" opacity="0.3"/></svg></div></div>`;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.i = i;
  card.innerHTML = `<div class="drink-header"><p class="drink-name">${c.name}</p><p class="drink-oz">${c.oz}</p></div>
    <p class="drink-ingredients">${c.ingredients}</p>
    ${sliders ? `<div class="sliders">${sliders}</div>` : ''}
    <p class="drink-tag">${c.tag}</p>${photo}
    <div class="price-row"><span class="serve-note">${c.serve}</span><span class="price">${c.price}</span></div>`;
  inner.appendChild(card);

  const d = document.createElement('button');
  d.className = 'dot-btn' + (i===0 ? ' active' : '');
  d.onclick = () => goTo(i);
  (document.getElementById("dotsInner") || dots).appendChild(d);
});

function goTo(idx) {
  idx = Math.max(0, Math.min(TOTAL - 1, idx));
  cur = idx;
  const cardW = inner.querySelector('.card').offsetWidth;
  inner.style.transform = `translateX(${-idx * cardW}px)`;
  updateUI();
}

function go(dir) { if (dir > 0 && cur >= TOTAL - 1) return; if (dir < 0 && cur <= 0) return; goTo(cur + dir); }

function setTrackWidth() {
  const card = inner.querySelector('.card');
  if (!card) return;
  const cardW = card.offsetWidth;
  const totalWidth = cardW * TOTAL;
  inner.style.width = `${totalWidth}px`;
  inner.style.minWidth = `${totalWidth}px`;
  inner.style.maxWidth = `${totalWidth}px`;
}

function updateUI(maxIndexOverride) {
  const cardW = inner.querySelector('.card')?.offsetWidth || 1;
  const totalWidth = inner.scrollWidth;
  const viewportWidth = document.getElementById('track').offsetWidth;
  const maxIndex = maxIndexOverride ?? Math.ceil((totalWidth - viewportWidth) / cardW);

  document.querySelectorAll('.dot-btn').forEach((d, i) => d.classList.toggle('active', i === cur));

  const atStart = cur <= 0;
  const atEnd = cur >= maxIndex;

  if (window.innerWidth > 600) {
    document.getElementById('arrowL').disabled = atStart;
    document.getElementById('arrowR').disabled = atEnd;
  }
  const mp = document.getElementById('mobilePrev');
  const mn = document.getElementById('mobileNext');
  if (mp) mp.style.opacity = atStart ? '0.25' : '1';
  if (mn) mn.style.opacity = atEnd ? '0.25' : '1';
}

// Touch swipe
let tx = 0;
document.getElementById('track').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.getElementById('track').addEventListener('touchend', e => {
  const diff = tx - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 40) go(diff > 0 ? 1 : -1);
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft')  go(-1);
});

// Show dots when menu in view
const obs = new IntersectionObserver(entries => {
  dots.classList.toggle('show', entries[0].isIntersecting);
}, { threshold: 0.05 });
obs.observe(document.getElementById('menu'));

updateUI();
setTrackWidth();
window.addEventListener('resize', () => { setTrackWidth(); goTo(cur); });
</script>
</body>
</html>
