<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>molcurphotos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  scrollbar-width: none;
}
*::-webkit-scrollbar { display: none; }

:root {
  --bg: #e8e4de;
  --navy: #1a2a4a;
  --white: #ffffff;
  --accent: #1a2a4a;
  --tile-gap: 8px;
  --btn-size: 88px;
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-swoop: cubic-bezier(.6,0,0,1);
}

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--navy);
  overscroll-behavior: none;
}

/* ── SCROLL SPACER ── */
.scroll-spacer {
  height: 400vh;
  position: relative;
}

/* ── NAV CONTAINER ── */
.nav-container {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* ── TILES WRAPPER ── */
.tiles-wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-grid {
  display: grid;
  grid-template-columns: repeat(3, var(--tile-size, 260px));
  grid-template-rows: repeat(3, var(--tile-size, 260px));
  gap: var(--tile-gap);
  position: relative;
}

/* ── INDIVIDUAL TILES ── */
.tile {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  pointer-events: auto;
  background: var(--navy);
  display: flex;
  align-items: flex-end;
  padding: 18px;
  transition: background 0.3s var(--ease);
  text-decoration: none;
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--tile-bg-img, linear-gradient(135deg, #1a2a4a 0%, #2a3f6a 100%));
  background-size: cover;
  background-position: center;
  opacity: 0.55;
  transition: opacity 0.4s var(--ease), transform 0.6s var(--ease);
  z-index: 0;
}

.tile:hover::before {
  opacity: 0.2;
  transform: scale(1.04);
}

.tile-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(20px, 2.2vw, 32px);
  color: white;
  letter-spacing: 0.04em;
  position: relative;
  z-index: 2;
  transition: transform 0.35s var(--ease), letter-spacing 0.35s var(--ease);
  line-height: 1;
}

.tile:hover .tile-label {
  transform: translateY(-3px);
  letter-spacing: 0.08em;
}

/* tile color accents on hover */
.tile-1:hover { background: #2a1a3a; }
.tile-2:hover { background: #1a3a2a; }
.tile-3:hover { background: #3a2a1a; }
.tile-4:hover { background: #1a2a3a; }
.tile-5:hover { background: #3a1a2a; }
.tile-6:hover { background: #2a3a1a; }
.tile-7:hover { background: #1a3a3a; }
.tile-8:hover { background: #3a3a1a; }

/* Center tile — logo/name */
.tile-center {
  grid-column: 2;
  grid-row: 2;
  background: var(--bg);
  border: 2px solid var(--navy);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: default;
  pointer-events: auto;
  padding: 0;
  gap: 0;
}

.tile-center::before { display: none; }

.center-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 2.5vw, 36px);
  letter-spacing: 0.06em;
  color: var(--navy);
  text-align: center;
  line-height: 1;
  padding: 0 12px;
}

.center-tagline {
  font-size: clamp(9px, 0.85vw, 12px);
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--navy);
  opacity: 0.6;
  margin-top: 6px;
  text-align: center;
  padding: 0 10px;
}

/* scroll chevrons inside center tile */
.scroll-hint {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity 1s ease 2s;
}
.scroll-hint.visible { opacity: 1; }
.scroll-hint svg {
  width: 18px;
  fill: none;
  stroke: var(--navy);
  stroke-width: 1.5;
  opacity: 0.4;
  animation: chevronPulse 1.8s ease-in-out infinite;
}
.scroll-hint svg:nth-child(2) { animation-delay: 0.2s; }
@keyframes chevronPulse {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(4px); opacity: 0.9; }
}

/* ── OVERLAY PAGE ── */
.page-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.65s var(--ease-swoop);
  pointer-events: none;
}

.page-overlay.open {
  transform: translateY(0);
  pointer-events: auto;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 48px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  position: sticky;
  top: 0;
  background: var(--navy);
  z-index: 10;
}

.page-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 0.06em;
  color: white;
  text-decoration: none;
}

.page-title-header {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}

.page-close {
  background: none;
  border: 1px solid rgba(255,255,255,0.25);
  color: white;
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, border-color 0.2s;
  font-size: 18px;
}
.page-close:hover { background: rgba(255,255,255,0.1); border-color: white; }

.page-content {
  padding: 60px 48px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

.page-hero-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(48px, 8vw, 120px);
  color: white;
  letter-spacing: 0.02em;
  line-height: 0.95;
  margin-bottom: 40px;
}

.page-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.55);
  font-weight: 300;
  line-height: 1.7;
  max-width: 560px;
  margin-bottom: 60px;
  letter-spacing: 0.02em;
}

/* Photo grid inside pages */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 6px;
}

.photo-grid-item {
  aspect-ratio: 3/4;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
  position: relative;
}

.photo-grid-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s var(--ease), filter 0.5s var(--ease);
  filter: grayscale(15%);
}
.photo-grid-item:hover img { transform: scale(1.04); filter: grayscale(0%); }

.photo-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.2);
}

/* ── ABOUT PAGE ── */
.about-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: start;
}

.about-stat {
  display: flex;
  flex-direction: column;
  margin-bottom: 32px;
}
.about-stat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  color: white;
  letter-spacing: 0.02em;
  line-height: 1;
}
.about-stat-label {
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-top: 4px;
}

.about-image {
  aspect-ratio: 3/4;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
}
.about-image img { width: 100%; height: 100%; object-fit: cover; }
.about-image-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(160deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 14px;
  letter-spacing: 0.15em; color: rgba(255,255,255,0.2);
}

.philosophy-block {
  border-top: 1px solid rgba(255,255,255,0.12);
  padding-top: 48px;
  margin-top: 48px;
}
.philosophy-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 20px;
}
.philosophy-text {
  font-size: clamp(18px, 2.5vw, 28px);
  color: white;
  line-height: 1.5;
  font-weight: 300;
  font-style: italic;
}

/* ── CONTACT / BOOK PAGE ── */
.book-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
}

.contact-field {
  display: flex;
  flex-direction: column;
  margin-bottom: 24px;
}
.contact-label {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-bottom: 8px;
}
.contact-input {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: white;
  padding: 14px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.contact-input:focus { border-color: rgba(255,255,255,0.4); }
.contact-input::placeholder { color: rgba(255,255,255,0.2); }
textarea.contact-input { resize: vertical; min-height: 120px; }

.book-btn {
  background: white;
  color: var(--navy);
  border: none;
  padding: 16px 40px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  margin-top: 8px;
}
.book-btn:hover { background: rgba(255,255,255,0.85); }

.contact-info-item {
  display: flex;
  flex-direction: column;
  margin-bottom: 32px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding-bottom: 32px;
}
.contact-info-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  margin-bottom: 8px;
}
.contact-info-value {
  font-size: 18px;
  color: white;
  font-weight: 300;
}

/* ── TESTIMONIALS ── */
.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
  margin-top: 48px;
}
.testimonial-card {
  border: 1px solid rgba(255,255,255,0.1);
  padding: 28px;
  background: rgba(255,255,255,0.03);
}
.testimonial-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 0.05em;
  color: white;
  margin-bottom: 12px;
}
.testimonial-text {
  font-size: 14px;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
  font-weight: 300;
}

/* ── BOTTOM TICKER ── */
.ticker-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 36px;
  background: var(--navy);
  display: flex;
  align-items: center;
  overflow: hidden;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.ticker-bar.visible { opacity: 1; }
.ticker-track {
  display: flex;
  white-space: nowrap;
  animation: ticker 25s linear infinite;
}
.ticker-item {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  padding: 0 32px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.ticker-item::after {
  content: '—';
  opacity: 0.3;
}
@keyframes ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ── BACK TO PORTFOLIO (inside overlay) ── */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  transition: color 0.2s;
  margin-bottom: 48px;
  display: block;
}
.back-link:hover { color: white; }

/* Social links */
.social-links {
  display: flex;
  gap: 20px;
  margin-top: 8px;
}
.social-link {
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.social-link:hover { color: white; border-color: rgba(255,255,255,0.4); }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  :root { --tile-gap: 4px; }
  .about-layout, .book-layout { grid-template-columns: 1fr; gap: 40px; }
  .page-content { padding: 40px 24px; }
  .page-header { padding: 20px 24px; }
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ── TILE SIZE CSS VAR (set by JS) ── */
</style>
</head>
<body>

<div class="scroll-spacer" id="scrollSpacer"></div>

<!-- TICKER BAR -->
<div class="ticker-bar" id="tickerBar">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<!-- NAV CONTAINER -->
<div class="nav-container" id="navContainer">
  <div class="tiles-wrapper" id="tilesWrapper">
    <div class="nav-grid" id="navGrid">

      <!-- Tile 1: Portraits -->
      <a class="tile tile-1" data-section="portraits" style="--tile-bg-img: linear-gradient(160deg,#2a1a3a,#1a1028)">
        <span class="tile-label">Portraits</span>
      </a>

      <!-- Tile 2: Senior -->
      <a class="tile tile-2" data-section="senior" style="--tile-bg-img: linear-gradient(160deg,#1a3a2a,#0f2219)">
        <span class="tile-label">Senior</span>
      </a>

      <!-- Tile 3: Weddings -->
      <a class="tile tile-3" data-section="weddings" style="--tile-bg-img: linear-gradient(160deg,#3a2a1a,#261a0e)">
        <span class="tile-label">Weddings</span>
      </a>

      <!-- Tile 4: Events -->
      <a class="tile tile-4" data-section="events" style="--tile-bg-img: linear-gradient(160deg,#1a2a3a,#0e1926)">
        <span class="tile-label">Events</span>
      </a>

      <!-- CENTER: Logo -->
      <div class="tile tile-center">
        <div class="center-logo">molcurphotos</div>
        <div class="center-tagline">Molly Curtis · Midwest</div>
        <div class="scroll-hint" id="scrollHint">
          <svg viewBox="0 0 20 12"><polyline points="2,2 10,10 18,2"/></svg>
          <svg viewBox="0 0 20 12"><polyline points="2,2 10,10 18,2"/></svg>
        </div>
      </div>

      <!-- Tile 5: Family -->
      <a class="tile tile-5" data-section="family" style="--tile-bg-img: linear-gradient(160deg,#3a1a2a,#26101b)">
        <span class="tile-label">Family</span>
      </a>

      <!-- Tile 6: Business -->
      <a class="tile tile-6" data-section="business" style="--tile-bg-img: linear-gradient(160deg,#2a3a1a,#1b260f)">
        <span class="tile-label">Business</span>
      </a>

      <!-- Tile 7: Projects -->
      <a class="tile tile-7" data-section="projects" style="--tile-bg-img: linear-gradient(160deg,#1a3a3a,#0f2626)">
        <span class="tile-label">Projects</span>
      </a>

      <!-- Tile 8: About & Book -->
      <a class="tile tile-8" data-section="about" style="--tile-bg-img: linear-gradient(160deg,#3a3a1a,#26260f)">
        <span class="tile-label">About</span>
      </a>

    </div>
  </div>
</div>

<!-- PAGE OVERLAYS -->
<div class="page-overlay" id="pageOverlay">
  <div class="page-header">
    <a class="page-brand" href="#">molcurphotos</a>
    <span class="page-title-header" id="overlayTitle"></span>
    <button class="page-close" id="closeBtn" aria-label="Close">✕</button>
  </div>
  <div class="page-content" id="overlayContent"></div>
</div>

<script>
// ── TILE SIZE ──────────────────────────────────────────────
function setTileSize() {
  const gap = window.innerWidth <= 768 ? 4 : 8;
  const maxGrid = 780;
  const vmin = Math.min(window.innerWidth, window.innerHeight);
  const size = Math.min(Math.floor((vmin - gap * 2 - 32) / 3), Math.floor((maxGrid - gap * 2) / 3));
  document.documentElement.style.setProperty('--tile-size', size + 'px');
  document.documentElement.style.setProperty('--tile-gap', gap + 'px');
}
setTileSize();
window.addEventListener('resize', setTileSize);

// ── SCROLL ANIMATION ──────────────────────────────────────
const tiles = document.querySelectorAll('.tile:not(.tile-center)');
const centerTile = document.querySelector('.tile-center');
const navGrid = document.getElementById('navGrid');
const scrollHint = document.getElementById('scrollHint');
const tickerBar = document.getElementById('tickerBar');

// Tile positions relative to center (col offset, row offset)
const tileOffsets = [
  [-1, -1], [0, -1], [1, -1],  // row 1
  [-1,  0],          [1,  0],  // row 2 (center skipped)
  [-1,  1], [0,  1], [1,  1],  // row 3
];

const initialScales = [2, 2, 2, 2, 2, 2, 2, 2];

function cubicBezierEase(t) {
  // ease-in-out-quart approximation
  return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
}

function updateScroll() {
  const scrollH = document.body.scrollHeight - window.innerHeight;
  const raw = Math.min(window.scrollY / scrollH, 1);
  const progress = cubicBezierEase(raw);

  const scale = 2 - progress; // 2 → 1
  const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
  const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-gap'));
  const unit = (tileSize + gap);

  tiles.forEach((tile, i) => {
    const [cx, cy] = tileOffsets[i];
    const spread = 1 - progress; // 1 → 0
    const tx = cx * unit * spread * 1.2;
    const ty = cy * unit * spread * 1.2;
    tile.style.transform = `scale(${scale}) translate(${tx / scale}px, ${ty / scale}px)`;
    tile.style.opacity = progress > 0.7 ? '1' : 0.3 + progress * 0.7;
    tile.style.pointerEvents = progress >= 0.98 ? 'auto' : 'none';
  });

  // Show/hide ticker
  if (progress >= 0.98) {
    tickerBar.classList.add('visible');
  } else {
    tickerBar.classList.remove('visible');
  }

  // scroll hint
  if (raw < 0.05) {
    scrollHint.classList.add('visible');
  } else {
    scrollHint.classList.remove('visible');
    scrollHint.style.transition = 'opacity 0.3s ease';
  }
}

window.addEventListener('scroll', updateScroll, { passive: true });
updateScroll();

// Show scroll hint after delay
setTimeout(() => scrollHint.classList.add('visible'), 2200);

// ── TICKER ────────────────────────────────────────────────
const tickerWords = ['Portraits', 'Senior', 'Weddings', 'Events', 'Family', 'Business', 'Projects', 'Minnesota', 'Wisconsin', 'Available Worldwide'];
const track = document.getElementById('tickerTrack');
const doubled = [...tickerWords, ...tickerWords];
doubled.forEach(w => {
  const span = document.createElement('span');
  span.className = 'ticker-item';
  span.textContent = w;
  track.appendChild(span);
});

// ── SECTION CONTENT ───────────────────────────────────────
const sections = {
  portraits: {
    title: 'Portraits',
    hero: 'Portraits',
    sub: 'Capturing personality, mood, and the essence of every individual. From editorial fashion to intimate personal sessions.',
    type: 'gallery',
    count: 8
  },
  senior: {
    title: 'Senior',
    hero: 'Senior',
    sub: 'Celebrating milestones with stunning imagery that captures this once-in-a-lifetime chapter.',
    type: 'gallery',
    count: 6
  },
  weddings: {
    title: 'Weddings',
    hero: 'Weddings',
    sub: 'Every love story is unique. Molly documents the emotion, details, and joy of your most important day.',
    type: 'gallery',
    count: 8
  },
  events: {
    title: 'Events',
    hero: 'Events',
    sub: 'From corporate gatherings to intimate celebrations, every event deserves to be remembered beautifully.',
    type: 'gallery',
    count: 6
  },
  family: {
    title: 'Family',
    hero: 'Family',
    sub: 'Authentic, joyful moments that will be treasured for generations to come.',
    type: 'gallery',
    count: 6
  },
  business: {
    title: 'Business',
    hero: 'Business',
    sub: 'Headshots and brand photography that make a strong first impression and elevate your professional presence.',
    type: 'gallery',
    count: 6
  },
  projects: {
    title: 'Projects',
    hero: 'Projects',
    sub: 'Creative directed series and personal projects — including The Zodiac Signs series and Street Photography.',
    type: 'projects'
  },
  about: {
    title: 'About & Book',
    hero: 'About',
    sub: '',
    type: 'about'
  }
};

function buildGallery(section) {
  const items = [];
  for (let i = 0; i < section.count; i++) {
    items.push(`<div class="photo-grid-item"><div class="photo-placeholder">Add Your Photo</div></div>`);
  }

// ── OPEN / CLOSE OVERLAY ──────────────────────────────────
const overlay = document.getElementById('pageOverlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayContent = document.getElementById('overlayContent');
const closeBtn = document.getElementById('closeBtn');

function openSection(key) {
  const sec = sections[key];
  if (!sec) return;

  overlayTitle.textContent = sec.title;

  let content = `<button class="back-link" id="backBtn">← Back to Portfolio</button>
    <div class="page-hero-text">${sec.hero}</div>`;

  if (sec.sub) content += `<p class="page-sub">${sec.sub}</p>`;

  if (sec.type === 'gallery') content += buildGallery(sec);
  else if (sec.type === 'projects') content += buildProjects();
  else if (sec.type === 'about') content += buildAbout();

  overlayContent.innerHTML = content;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  document.getElementById('backBtn').addEventListener('click', closeOverlay);
}

function closeOverlay() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeOverlay);

document.querySelectorAll('.tile[data-section]').forEach(tile => {
  tile.addEventListener('click', (e) => {
    e.preventDefault();
    openSection(tile.dataset.section);
  });
});

// ESC key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeOverlay();
});
